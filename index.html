<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ลงทะเบียนเข้าใช้งาน</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root{
    --bg:#f2f4f7;
    --card:#ffffff;
    --field:#f4f6f9;
    --field-focus:#ffffff;
    --line:#e2e6ed;
    --text:#1d2230;
    --muted:#737a8c;
    --brand:#06c755;          /* LINE green */
    --brand-press:#05a648;
    --danger:#e23b40;
    --radius:14px;
    --font:'Noto Sans Thai','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);}
  body{
    min-height:100dvh;
    display:flex;align-items:flex-start;justify-content:center;
    padding:env(safe-area-inset-top,16px) 16px calc(env(safe-area-inset-bottom,16px) + 16px);
  }
  .wrap{width:100%;max-width:440px;margin-top:24px;}

  .head{margin:4px 2px 18px;}
  .head h1{font-size:1.35rem;font-weight:700;margin:0 0 4px;letter-spacing:.2px;}
  .head p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.5;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px 20px;
    box-shadow:0 1px 3px rgba(20,30,55,.06), 0 8px 24px rgba(20,30,55,.05);
  }

  /* identity strip pulled from LINE profile */
  .me{
    display:flex;align-items:center;gap:12px;
    background:var(--field);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:18px;
  }
  .me img{width:42px;height:42px;border-radius:50%;background:var(--line);object-fit:cover;flex:0 0 auto;}
  .me .nm{font-weight:600;font-size:.95rem;line-height:1.2;}
  .me .sub{color:var(--muted);font-size:.72rem;margin-top:2px;}

  label{display:block;font-size:.8rem;color:var(--muted);margin:0 2px 6px;}
  .field{margin-bottom:15px;}
  input,select{
    width:100%;height:48px;border-radius:11px;
    background:var(--field);border:1px solid var(--line);
    color:var(--text);font-size:1rem;font-family:inherit;
    padding:0 14px;outline:none;transition:border-color .15s,background .15s;
    appearance:none;-webkit-appearance:none;
  }
  input::placeholder{color:#a4abba;}
  input:focus,select:focus{border-color:var(--brand);background:var(--field-focus);}
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b90a0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;
  }
  select:invalid{color:#a4abba;}

  .err{color:var(--danger);font-size:.74rem;margin:6px 2px 0;min-height:1em;}

  button{
    width:100%;height:50px;margin-top:6px;
    border:0;border-radius:12px;cursor:pointer;
    background:var(--brand);color:#ffffff;font-weight:700;font-size:1rem;
    font-family:inherit;transition:background .15s,transform .05s,opacity .15s;
    box-shadow:0 4px 12px rgba(6,199,85,.28);
  }
  button:active{transform:translateY(1px);background:var(--brand-press);}
  button:disabled{opacity:.5;cursor:default;}

  /* status overlay */
  .status{
    position:fixed;inset:0;background:rgba(242,244,247,.97);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:32px;z-index:10;
  }
  .status.show{display:flex;}
  .status .icon{font-size:3rem;line-height:1;}
  .status h2{margin:0;font-size:1.15rem;}
  .status p{margin:0;color:var(--muted);font-size:.85rem;max-width:300px;line-height:1.55;}
  .spinner{
    width:38px;height:38px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--brand);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .linkbtn{background:none;border:1px solid var(--line);color:var(--text);height:44px;width:auto;padding:0 22px;margin-top:6px;}

  /* language toggle */
  .topbar{display:flex;justify-content:flex-end;margin:0 2px 10px;}
  .lang{
    display:inline-flex;background:var(--field);border:1px solid var(--line);
    border-radius:999px;padding:3px;gap:2px;
  }
  .lang button{
    width:auto;height:auto;margin:0;border-radius:999px;padding:5px 14px;
    background:transparent;color:var(--muted);font-size:.8rem;font-weight:600;
    box-shadow:none;transition:background .15s,color .15s;
  }
  .lang button.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(20,30,55,.12);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="lang">
        <button id="langEN" class="active" type="button">EN</button>
        <button id="langTH" type="button">ไทย</button>
      </div>
    </div>
    <div class="head">
      <h1 id="t_title">Register for access</h1>
      <p id="t_sub">Fill in your details to send an approval request. Your LINE name is detected automatically.</p>
    </div>

    <div class="card">
      <!-- profile pulled from LINE -->
      <div class="me" id="me" style="display:none;">
        <img id="mePic" alt="" />
        <div>
          <div class="nm" id="meName">—</div>
          <div class="sub" id="meId">LINE ID: —</div>
        </div>
      </div>

      <div class="field">
        <label for="name" id="t_lblName">Name</label>
        <input id="name" type="text" autocomplete="given-name" placeholder="Your name" maxlength="60" />
      </div>

      <div class="field">
        <label for="surname" id="t_lblSurname">Surname</label>
        <input id="surname" type="text" autocomplete="family-name" placeholder="Your surname" maxlength="60" />
      </div>

      <div class="field">
        <label for="flagship" id="t_lblFlagship">Flagship</label>
        <select id="flagship" required>
          <option value="" disabled selected id="t_optDefault">— Flagship —</option>
          <option value="GC">GC</option>
          <option value="TOP">TOP</option>
          <option value="IRPC">IRPC</option>
          <option value="OR">OR</option>
          <option value="PTTCL">PTTCL</option>
          <option value="PTTPC">PTTPC</option>
          <option value="PTTTC">PTTTC</option>
          <option value="TPX">TPX</option>
        </select>
      </div>

      <div class="err" id="err"></div>
      <button id="submit" disabled>Send request</button>
    </div>
  </div>

  <!-- status overlay -->
  <div class="status" id="status">
    <div id="stIcon"></div>
    <h2 id="stTitle"></h2>
    <p id="stMsg"></p>
    <button class="linkbtn" id="stClose" style="display:none;">Close</button>
  </div>

<script>
  // ════════════════════════════════════════════════════════════════════
  //  CONFIG — ใส่ LIFF ID ของคุณที่นี่ (ได้จาก LINE Developers > LIFF)
  // ════════════════════════════════════════════════════════════════════
  var LIFF_ID = "YOUR_LIFF_ID";
  // ════════════════════════════════════════════════════════════════════

  var profile = null;

  var $ = function (id) { return document.getElementById(id); };

  // ── i18n ──────────────────────────────────────────────────────────────
  var I18N = {
    en: {
      title: "Register for access",
      sub: "Fill in your details to send an approval request. Your LINE name is detected automatically.",
      lblName: "Name", lblSurname: "Surname", lblFlagship: "Flagship",
      optDefault: "— Flagship —",
      phName: "Your name", phSurname: "Your surname",
      submit: "Send request", close: "Close",
      unknownName: "(name unavailable)",
      errComma: "Name / surname cannot contain a comma (,)",
      sending: "Sending request…", pleaseWait: "Please wait",
      sentTitle: "Request sent",
      sentMsg: "The administrator has received your request. Please wait for approval.",
      failTitle: "Could not send request",
      failMsg: "Please open this page from inside the bot chat and try again.",
      initFail: "Unable to start",
      initFailMsg: "Check the LIFF ID or reopen this page via the LIFF link."
    },
    th: {
      title: "ลงทะเบียนเข้าใช้งาน",
      sub: "กรอกข้อมูลเพื่อส่งคำขอให้ผู้ดูแลระบบอนุมัติ ระบบจะดึงชื่อ LINE ของคุณให้อัตโนมัติ",
      lblName: "ชื่อ", lblSurname: "นามสกุล", lblFlagship: "Flagship",
      optDefault: "— Flagship —",
      phName: "ชื่อของคุณ", phSurname: "นามสกุลของคุณ",
      submit: "ส่งคำขอ", close: "ปิดหน้าต่าง",
      unknownName: "(ไม่ทราบชื่อ)",
      errComma: "ชื่อ/นามสกุลห้ามมีเครื่องหมายจุลภาค (,)",
      sending: "กำลังส่งคำขอ…", pleaseWait: "โปรดรอสักครู่",
      sentTitle: "ส่งคำขอเรียบร้อย",
      sentMsg: "ผู้ดูแลระบบได้รับคำขอของคุณแล้ว โปรดรอการอนุมัติสักครู่นะครับ",
      failTitle: "ส่งคำขอไม่สำเร็จ",
      failMsg: "กรุณาเปิดหน้านี้จากในแชทของบอท แล้วลองใหม่อีกครั้ง",
      initFail: "เปิดระบบไม่สำเร็จ",
      initFailMsg: "ตรวจสอบ LIFF ID หรือเปิดหน้านี้ผ่านลิงก์ LIFF อีกครั้ง"
    }
  };
  var lang = "en";
  function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

  function applyLang() {
    document.documentElement.lang = lang;
    $("t_title").textContent = t("title");
    $("t_sub").textContent = t("sub");
    $("t_lblName").textContent = t("lblName");
    $("t_lblSurname").textContent = t("lblSurname");
    $("t_lblFlagship").textContent = t("lblFlagship");
    $("t_optDefault").textContent = t("optDefault");
    $("name").placeholder = t("phName");
    $("surname").placeholder = t("phSurname");
    $("submit").textContent = t("submit");
    $("stClose").textContent = t("close");
    $("langEN").classList.toggle("active", lang === "en");
    $("langTH").classList.toggle("active", lang === "th");
    // refresh profile sub-line + any open error in the new language
    if (profile) $("meName").textContent = profile.displayName || t("unknownName");
  }
  $("langEN").addEventListener("click", function () { lang = "en"; applyLang(); });
  $("langTH").addEventListener("click", function () { lang = "th"; applyLang(); });

  function showStatus(icon, title, msg, opts) {
    opts = opts || {};
    $("stIcon").innerHTML = opts.spinner
      ? '<div class="spinner"></div>'
      : '<div class="icon">' + icon + '</div>';
    $("stTitle").textContent = title;
    $("stMsg").textContent = msg;
    $("stClose").style.display = opts.closeBtn ? "inline-block" : "none";
    $("status").classList.add("show");
  }
  function hideStatus() { $("status").classList.remove("show"); }

  function setError(t) { $("err").textContent = t || ""; }

  // enable submit only when all fields valid
  function validate() {
    var name = $("name").value.trim();
    var surname = $("surname").value.trim();
    var flagship = $("flagship").value;
    var ok = name.length > 0 && surname.length > 0 && !!flagship && !!profile;
    $("submit").disabled = !ok;
    return ok;
  }
  ["name", "surname", "flagship"].forEach(function (id) {
    $(id).addEventListener("input", function () { setError(""); validate(); });
    $(id).addEventListener("change", function () { setError(""); validate(); });
  });

  // ── submit ──────────────────────────────────────────────────────────
  $("submit").addEventListener("click", function () {
    if (!validate()) return;

    var name = $("name").value.trim();
    var surname = $("surname").value.trim();
    var flagship = $("flagship").value;

    // guard: names containing comma would break the "/submit a, b, c" parser
    if (name.indexOf(",") >= 0 || surname.indexOf(",") >= 0) {
      setError(t("errComma"));
      return;
    }

    // build the exact command the existing Access Router already understands:
    //   /submit Name, Surname, flagship
    var text = "/submit " + name + ", " + surname + ", " + flagship;

    $("submit").disabled = true;
    showStatus("", t("sending"), t("pleaseWait"), { spinner: true });

    // sendMessages posts the text into the chat AS the user, so the bot's
    // existing webhook flow (Access Router -> submit -> Push to Admins ->
    // Reply) runs unchanged, with a valid replyToken.
    liff.sendMessages([{ type: "text", text: text }])
      .then(function () {
        showStatus("✅", t("sentTitle"), t("sentMsg"), { closeBtn: true });
      })
      .catch(function (e) {
        // sendMessages only works when LIFF is opened inside a chat with the
        // chat_message.write scope. Fall back to telling the user to retry.
        showStatus("⚠️", t("failTitle"),
          t("failMsg") + "\n(" + (e && e.message ? e.message : "sendMessages error") + ")",
          { closeBtn: true });
        $("submit").disabled = false;
      });
  });

  $("stClose").addEventListener("click", function () {
    if (liff.isInClient()) liff.closeWindow();
    else hideStatus();
  });

  // ── init ────────────────────────────────────────────────────────────
  function fillProfile(p) {
    profile = p;
    $("meName").textContent = p.displayName || t("unknownName");
    $("meId").textContent = "LINE ID: " + (p.userId || "").slice(0, 10) + "…";
    if (p.pictureUrl) $("mePic").src = p.pictureUrl;
    $("me").style.display = "flex";
    validate();
  }

  applyLang(); // render default (EN) before LIFF resolves

  liff.init({ liffId: LIFF_ID })
    .then(function () {
      if (!liff.isLoggedIn()) {
        // trigger LINE login; on return, init runs again and we proceed
        liff.login();
        return;
      }
      return liff.getProfile().then(fillProfile);
    })
    .catch(function (e) {
      showStatus("⚠️", t("initFail"),
        t("initFailMsg") + "\n(" + (e && e.message ? e.message : "init error") + ")",
        { closeBtn: true });
    });
</script>
</body>
</html>
